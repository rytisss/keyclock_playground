services:
  postgres:
    image: postgres:16-alpine
    container_name: kc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kc-server
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes/cvdlink:/opt/keycloak/themes/cvdlink:ro
    depends_on:
      postgres:
        condition: service_healthy

  openldap:
    image: osixia/openldap:1.5.0
    container_name: kc-openldap
    profiles: ["ldap"]
    environment:
      LDAP_ORGANISATION: CVDLINK
      LDAP_DOMAIN: cvdlink.local
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
    ports:
      - "389:389"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: ["--copy-service"]

  ldap-seed:
    build:
      context: ./ldap
      dockerfile: seed/Dockerfile
    container_name: kc-ldap-seed
    profiles: ["ldap"]
    depends_on:
      - openldap
      - keycloak
    environment:
      LDAP_URL: ldap://openldap:389
      LDAP_BASE_DN: dc=cvdlink,dc=local
      LDAP_ADMIN_DN: cn=admin,dc=cvdlink,dc=local
      LDAP_ADMIN_PASSWORD: admin
      KC_URL: http://keycloak:8080
      KC_ADMIN_USER: admin
      KC_ADMIN_PASSWORD: admin
      KC_REALM: ldap

volumes:
  postgres_data:
  openldap_data:
  openldap_config:
